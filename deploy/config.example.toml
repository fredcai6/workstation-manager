# Copy to ~/.config/workstation-manager/config.toml. Every key is optional; defaults are in
# workstation_manager/config.py.

# The compute card's PCI address (`ws status` lists them). Unset: the AMD card with
# the most VRAM.
# pci_id = "0000:03:00.0"

# Env file for `docker compose` on interactive/docker-compose.yml: model file names,
# MODELS_HOST_PATH, aliases.
# env_file = "~/models.env"

# Proxy listen addresses: loopback, plus the Docker bridge gateways that client
# containers (the gate, host.docker.internal) arrive on.
# listen = ["127.0.0.1", "172.17.0.1", "172.18.0.1"]

# Where the status page is written. Add a static site's directory to read it remotely.
# page_dirs = ["~/.local/state/workstation-manager/page", "/srv/site/gpu-status"]

# Batch may take the card after this long without an assistant request (X-GPU-Hold: 1).
# hold_minutes = 30

# Daily windows (local time) when the interactive pair stays up with the default model.
# reserve_windows = ["07:30-08:00"]

# Headroom kept free on top of every job and the pair.
# margin_mib = 1024

# Single model: the env file above and the pair's measured VRAM.
# pair_vram_mib = 30000

# Several models in the LLM slot instead (replaces env_file / pair_vram_mib). Each env
# file holds the pair's full settings with that LLM; keep the ASR_* lines identical.
# default_model = "small"
#
# [models.small]
# env_file = "~/.config/workstation-manager/small.env"
# vram_mib = 12500
#
# [models.big]
# env_file = "~/.config/workstation-manager/big.env"
# aliases = ["big-model-file-name"]
# vram_mib = 27500

# On-demand GPU servers: started by the first request on `port`, stopped once idle.
# Each runs the compose service of the same name (profile of the same name) and
# listens on 127.0.0.1:`backend`.
# [services.ocr]
# port = 8007
# backend = 18007
# vram_mib = 11000
# idle_seconds = 120
